<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="system-ui, Segoe UI, Arial, sans-serif">
  <title>Mockup — Login e terminal do atendente</title>
  <rect width="800" height="560" fill="#f5f7f6"/>
  <text x="40" y="58" font-size="30" font-weight="700" fill="#12355b">nassauTickets</text>
  <text x="760" y="56" font-size="15" fill="#1b1f23" text-anchor="end">Conectado como <tspan font-weight="700">Ana</tspan> (atendente)  [Sair]</text>

  <!-- Login -->
  <text x="40" y="118" font-size="20" font-weight="700" fill="#1b1f23">1. Login</text>
  <rect x="40" y="134" width="300" height="200" rx="8" fill="#fff" stroke="#ccc"/>
  <g font-size="15" fill="#1b1f23">
    <text x="60" y="166">Login</text><rect x="60" y="174" width="260" height="34" rx="4" fill="#fff" stroke="#999"/>
    <text x="60" y="232">Senha</text><rect x="60" y="240" width="260" height="34" rx="4" fill="#fff" stroke="#999"/>
    <text x="72" y="263" fill="#999">••••••••</text>
  </g>
  <rect x="60" y="288" width="100" height="36" rx="6" fill="#12355b"/><text x="110" y="311" font-size="15" fill="#fff" text-anchor="middle">Entrar</text>

  <!-- Terminal -->
  <text x="380" y="118" font-size="20" font-weight="700" fill="#1b1f23">2. Terminal do atendente</text>
  <rect x="380" y="134" width="380" height="390" rx="8" fill="#fff" stroke="#ccc"/>
  <g font-size="15" fill="#1b1f23">
    <text x="400" y="170">Guichê</text><rect x="456" y="152" width="56" height="28" rx="4" fill="#fff" stroke="#999"/><text x="470" y="171">2 ▾</text>
    <text x="740" y="170" text-anchor="end">Na fila: <tspan font-weight="700">7</tspan></text>
    <text x="400" y="215">Senha <tspan font-size="22" font-weight="700" fill="#12355b">261126-SP003</tspan> (Prioritária)</text>
    <text x="400" y="242">Situação: <tspan font-weight="700">Chamada</tspan></text>
  </g>
  <rect x="400" y="262" width="200" height="50" rx="6" fill="#12355b"/><text x="500" y="293" font-size="17" fill="#fff" text-anchor="middle">Iniciar atendimento</text>
  <rect x="612" y="268" width="134" height="38" rx="6" fill="#fff" stroke="#12355b" stroke-width="2"/><text x="679" y="292" font-size="14" fill="#12355b" text-anchor="middle">Chamar novamente</text>
  <line x1="400" y1="336" x2="740" y2="336" stroke="#ddd"/>
  <g font-size="13" fill="#555">
    <text x="400" y="362">Sem senha em aberto → botão "Chamar próxima senha".</text>
    <text x="400" y="384">Chamada → Iniciar atendimento / Chamar novamente.</text>
    <text x="400" y="406">Chamada novamente → Iniciar / Não compareceu.</text>
    <text x="400" y="428">Em atendimento → Encerrar atendimento.</text>
    <text x="400" y="450">O guichê fica travado enquanto há senha em aberto.</text>
  </g>
</svg>
